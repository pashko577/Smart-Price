spring.application.name=smartprice-app

# Lee MONGODB_URI y MONGODB_DATABASE del mismo .env que usan los jobs de Spark.
# Se busca en la carpeta de ejecución y en la carpeta padre (por si se ejecuta desde smartprice-app/).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:smartprice_db}
# Compatibilidad con la propiedad anterior a Spring Boot 4.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:smartprice_db}

# Puerto configurable con la variable SERVER_PORT (8080 suele estar ocupado por otras apps).
server.port=${SERVER_PORT:8085}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.thymeleaf.cache=false

# CSS, JS e imágenes con huella de contenido en la URL (app-<hash>.css): cuando cambian, el navegador
# descarga la versión nueva; mientras no cambian, se guardan en caché un año.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Parámetros de presentación
smartprice.alerts.dashboard-limit=8
smartprice.alerts.page-size=50
