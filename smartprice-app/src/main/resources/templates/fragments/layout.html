<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · SmartPrice'">SmartPrice</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        // Aplica el tema guardado antes de pintar, para evitar el parpadeo.
        (function () {
            var t = localStorage.getItem("smartprice-theme");
            if (t) document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
</head>
<body>

<header th:fragment="header" class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">SmartPrice<span>Mercado Mayorista de Lima</span></a>
        <nav class="nav" aria-label="Principal">
            <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
            <a th:href="@{/products}" th:classappend="${active == 'products'} ? 'active'">Productos</a>
            <a th:href="@{/alerts}" th:classappend="${active == 'alerts'} ? 'active'">Alertas</a>
            <a th:href="@{/context}" th:classappend="${active == 'context'} ? 'active'">Contexto</a>
            <a th:href="@{/sources}" th:classappend="${active == 'sources'} ? 'active'">Fuentes</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">Tema</button>
    </div>
</header>

<footer th:fragment="footer" class="site">
    Fuente: MIDAGRI — SISAP (precios y volumen del Gran Mercado Mayorista de Lima).
    Precios promedio mayoristas en soles por kg, litro o unidad; no son precios al consumidor.
    Indicadores calculados con Apache Spark.
    <script>
        document.getElementById("theme-toggle").addEventListener("click", function () {
            var root = document.documentElement;
            var current = root.getAttribute("data-theme")
                || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            var next = current === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            localStorage.setItem("smartprice-theme", next);
            document.dispatchEvent(new CustomEvent("smartprice:theme"));
        });
    </script>
</footer>

</body>
</html>
